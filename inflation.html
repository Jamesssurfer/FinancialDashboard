<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>US Inflation Dashboard</title>
<style>
  :root { --up:#c0392b; --down:#1e8449; --flat:#7f8c8d; --bg:#0f1115; --card:#181b21; --text:#e6e6e6; --muted:#9aa0a6; --accent:#2d6cdf; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 0 24px 24px; }

  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 16px 0; margin-bottom: 12px; border-bottom: 1px solid #22252c; }
  nav a { color: var(--muted); font-size: 13px; text-decoration: none; padding: 6px 12px; border-radius: 999px; }
  nav a:hover { color: var(--text); background: var(--card); }
  nav a.active { color: var(--text); background: var(--accent); }

  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .updated { color: var(--muted); font-size: 12px; margin: 4px 0 20px; }

  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .summary-card { flex: 1; min-width: 160px; background: var(--card); border-radius: 10px; padding: 14px 16px; }
  .summary-card .label { color: var(--muted); font-size: 12px; }
  .summary-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .summary-card .value.up { color: var(--up); }
  .summary-card .value.down { color: var(--down); }
  .summary-card .value.flat { color: var(--flat); }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; font-size: 13px; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-bottom: 1px solid #2a2e37; position: sticky; top: 0; background: var(--card); }
  tbody tr:not(:last-child) td { border-bottom: 1px solid #20232a; }
  td.up { color: var(--up); } td.down { color: var(--down); } td.flat { color: var(--flat); }
  .cell-date { color: var(--muted); font-size: 10px; margin-top: 1px; }
  .dim { color: var(--muted); }

  details summary { cursor: pointer; color: var(--accent); font-size: 12px; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { margin-bottom: 6px; }
  canvas { display: block; }
</style>
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="inflation.html" class="active">Inflation</a>
    <a href="labor.html" >Labor Market</a>
    <a href="economy.html" >Economy</a>
    <a href="consumer.html" >Consumer</a>
    <a href="interest-rate.html" >Interest Rate</a>
  </nav>

  <h1>US Inflation</h1>
  <div class="updated" id="updated">Loading…</div>

  <div class="summary" id="summary"></div>

  <table>
    <thead>
      <tr><th>Metric</th><th>Current</th><th>1Y ago</th><th>3Y ago</th><th>5Y ago</th><th>10Y ago</th><th></th></tr>
    </thead>
    <tbody id="metric-rows"></tbody>
  </table>

<script src="dashboard.js"></script>
<script>renderDashboard('data/inflation.json');</script>
</body>
</html>
