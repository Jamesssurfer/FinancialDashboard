<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>US Inflation Dashboard</title>
<style>
  :root { --up:#e5484d; --down:#e5484d; --good:#30a46c; --bad:#e5484d; --flat:#7d828c; --bg:#0b0d10; --card:#15171c; --card2:#191c22; --text:#eceef1; --muted:#8a8f98; --accent:#5884ff; --border:#22252c; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0 24px 32px; -webkit-font-smoothing: antialiased; }

  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 16px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  nav a { color: var(--muted); font-size: 13px; text-decoration: none; padding: 6px 12px; border-radius: 999px; }
  nav a:hover { color: var(--text); background: var(--card); }
  nav a.active { color: #fff; background: var(--accent); }

  h1 { font-size: 19px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 12px; font-weight: 650; color: var(--muted); margin: 30px 0 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .updated { color: var(--muted); font-size: 12px; margin: 4px 0 22px; }

  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .summary-card { flex: 1; min-width: 170px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px 17px; }
  .summary-card .label { color: var(--muted); font-size: 11.5px; }
  .summary-card .value { font-size: 23px; font-weight: 700; margin-top: 5px; letter-spacing: -0.01em; }
  .value.good, .mini-value.good { color: var(--good); }
  .value.bad, .mini-value.bad { color: var(--bad); }
  .value.flat, .mini-value.flat { color: var(--flat); }

  .group-section { margin-bottom: 4px; }
  .group-title { font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .mini-card { background: var(--card2); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; }
  .mini-label { font-size: 10.5px; color: var(--muted); margin-bottom: 3px; line-height: 1.25; min-height: 26px; }
  .mini-value { font-size: 15px; font-weight: 650; }
  .mini-date { font-size: 9.5px; color: var(--muted); margin-top: 2px; }

  .selector-row { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
  select { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  #selected-label { color: var(--muted); font-size: 12px; }

  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .chart-title { color: var(--muted); font-size: 11.5px; font-weight: 600; margin-bottom: 8px; }
  .chart-box canvas { width: 100%; height: 220px; display: block; }
  @media (max-width: 700px) { .chart-grid { grid-template-columns: 1fr; } }
  .trend-summary { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-top: 10px; overflow: hidden; }
  .trend-summary td { padding: 10px 14px; font-size: 13px; }
  .trend-summary td.cur { font-weight: 650; color: var(--accent); }
  .trend-summary .cell-date { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .trend-summary .dim { color: var(--muted); }

</style>
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="inflation.html" class="active">Inflation</a>
    <a href="labor.html" >Labor Market</a>
    <a href="economy.html" >Economy</a>
    <a href="consumer.html" >Consumer</a>
    <a href="interest-rate.html" >Interest Rate</a>
  </nav>

  <h1>US Inflation</h1>
  <div class="updated" id="updated">Loading…</div>

  <div class="summary" id="summary"></div>

  <div id="metric-groups"></div>

  <h2>Trend Detail</h2>
  <div class="selector-row">
    <select id="metric-select"></select>
    <span id="selected-label"></span>
  </div>
  <table class="trend-summary">
    <tbody><tr id="trend-summary-row"></tr></tbody>
  </table>
  <div class="chart-grid">
    <div class="chart-box"><div class="chart-title">1 Year</div><canvas id="win-1y" width="700" height="300"></canvas></div>
    <div class="chart-box"><div class="chart-title">3 Years</div><canvas id="win-3y" width="700" height="300"></canvas></div>
    <div class="chart-box"><div class="chart-title">5 Years</div><canvas id="win-5y" width="700" height="300"></canvas></div>
    <div class="chart-box"><div class="chart-title">10 Years</div><canvas id="win-10y" width="700" height="300"></canvas></div>
  </div>

<script src="arrow-modes.js"></script>
<script>
window.PAGE_GROUPS = [
  { title: 'CPI & PPI', keys: ['cpi_yoy','cpi_mom','core_cpi_yoy','core_cpi_mom','ppi_mom','ppi_yoy','core_ppi_mom','core_ppi_yoy'] },
  { title: 'PCE & UoM Inflation Expectations', keys: ['core_pce_mom','core_pce_yoy','prelim_uom','uom'] },
  { title: 'Employment Cost, Earnings, Trade Prices & ISM Prices Paid', keys: ['eci_qoq','avg_hourly_mom','import_mom','export_mom','ism_mfg','ism_svc'] },
  { title: 'GDP Price Index', keys: ['advance_gdp_pi','prelim_gdp_pi','final_gdp_pi'] }
];
// Every Inflation metric: falling is favorable (green), rising is unfavorable (red).
window.ARROW_MODE = window.ARROW_MODES.inflation || {};

</script>
<script src="dashboard.js"></script>
<script>renderDashboard('data/inflation.json');</script>
</body>
</html>
