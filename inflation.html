<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>US Inflation Dashboard</title>
<style>
  :root { --up:#c0392b; --down:#1e8449; --flat:#7f8c8d; --bg:#0f1115; --card:#181b21; --text:#e6e6e6; --muted:#9aa0a6; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .back { color: var(--muted); font-size: 12px; text-decoration: none; }
  .back:hover { color: var(--text); }
  .updated { color: var(--muted); font-size: 12px; margin: 4px 0 20px; }

  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .summary-card { flex: 1; min-width: 160px; background: var(--card); border-radius: 10px; padding: 14px 16px; }
  .summary-card .label { color: var(--muted); font-size: 12px; }
  .summary-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .summary-card .value.up { color: var(--up); }
  .summary-card .value.down { color: var(--down); }
  .summary-card .value.flat { color: var(--flat); }

  .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .metric-card { background: var(--card); border-radius: 10px; padding: 12px 14px; }
  .metric-title { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .metric-value { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .metric-value.up { color: var(--up); } .metric-value.down { color: var(--down); } .metric-value.flat { color: var(--flat); }
  .metric-text-value { font-size: 15px; font-weight: 600; padding: 10px 0; }
  .metric-date { font-size: 11px; color: var(--muted); }
  .metric-card canvas { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
  <a class="back" href="index.html">← Dashboard</a>
  <h1>US Inflation — All Metrics (1Y)</h1>
  <div class="updated" id="updated">Loading…</div>

  <div class="summary" id="summary"></div>
  <div class="metric-grid" id="metric-grid"></div>

<script src="dashboard.js"></script>
<script>renderDashboard('data/inflation.json');</script>
</body>
</html>
