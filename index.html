<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Financial Dashboard</title>
<style>
  :root { --bg:#0f1115; --card:#181b21; --text:#e6e6e6; --muted:#9aa0a6; --accent:#2d6cdf; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  a.card { flex: 1; min-width: 180px; display: block; background: var(--card); border: 1px solid #2a2e37; border-radius: 12px; padding: 18px; text-decoration: none; color: var(--text); transition: border-color 0.15s; }
  a.card:hover { border-color: var(--accent); }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
  .card-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>
  <h1>Financial Dashboard</h1>
  <div class="row">
    <a class="card" href="inflation.html">
      <div class="card-title">US Inflation</div>
      <div class="card-desc">CPI, PPI, Core PCE — current, 1/3/5/10Y</div>
    </a>
    <a class="card" href="labor.html">
      <div class="card-title">US Labor Market</div>
      <div class="card-desc">Unemployment, payrolls, JOLTS, weekly claims</div>
    </a>
    <a class="card" href="economy.html">
      <div class="card-title">US Economy</div>
      <div class="card-desc">GDP, ISM PMIs, Retail Sales, diagnostics</div>
    </a>
    <a class="card" href="consumer.html">
      <div class="card-title">US Consumer</div>
      <div class="card-desc">Sentiment, income, household debt</div>
    </a>
    <a class="card" href="interest-rate.html">
      <div class="card-title">Real Interest Rate</div>
      <div class="card-desc">Current + rolling 3M ranking, 8 countries</div>
    </a>
  </div>
</body>
</html>
